name: Deploy to GitHub Pages

# push 到 main 就自动构建并发布；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: python-island/package-lock.json

      - name: 安装依赖（postinstall 会自动复制 Pyodide 运行时）
        working-directory: python-island
        run: npm ci

      - name: 构建
        working-directory: python-island
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: python-island/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4